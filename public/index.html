<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TGVCBot Controller</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/sort@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="/style.css" />
  </head>

  <body x-data="app()" x-init="initApp()" :class="{ 'light-theme': isLightTheme }">

    <!-- ── Ambient glow (fades in while streaming) ── -->
    <div class="ambient" :class="{ on: active }"></div>

    <!-- ── Top bar ── -->
    <header class="topbar">
      <div class="topbar-title">
        <div class="topbar-mark">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
          </svg>
        </div>
        <div>
          <div class="topbar-name" x-text="groupName">Group Stream</div>
          <div class="topbar-sub">
            <span x-text="'#' + chatId"></span>
          </div>
        </div>
      </div>
      <div class="status-pill" :class="active ? 'streaming' : 'idle'">
        <div class="status-dot"></div>
        <span x-text="active ? 'Live' : 'Idle'"></span>
      </div>
    </header>

    <!-- ── Scrollable content ── -->
    <div class="page-content">

      <!-- Player tab -->
      <div class="tab-panel" :class="{ active: activeTab === 'player' }">

        <!-- Now playing hero — square art with a faint spinning vinyl edge behind -->
        <div class="np-hero">
          <div class="album-stage" :class="{ playing: active && isPlaying, paused: active && !isPlaying }">
            <div class="vinyl-disc"></div>
            <div class="album-art">
              <template x-if="currentTrack && currentTrack.image">
                <img :src="currentTrack.image" alt="" />
              </template>
              <template x-if="!currentTrack || !currentTrack.image">
                <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
                </svg>
              </template>
            </div>
          </div>
          <div class="now-playing-info">
            <div class="np-title" x-text="currentTrack ? currentTrack.title : 'Nothing playing'"></div>
            <div class="np-artist" x-text="currentTrack ? currentTrack.artist : 'Search a song to start streaming'"></div>
            <template x-if="currentTrack && currentTrack.requestedBy">
              <span class="np-req">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
                </svg>
                <span x-text="'Requested by ' + currentTrack.requestedBy.first_name"></span>
              </span>
            </template>
          </div>
        </div>

        <!-- Controls -->
        <div class="controls">
          <button class="btn-ctrl danger" @click="controlAction('stop')" title="Stop">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>
          </button>
          <button class="btn-ctrl primary" @click="togglePlay()" title="Play / Pause">
            <template x-if="isPlaying">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
            </template>
            <template x-if="!isPlaying">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8V4z"/></svg>
            </template>
          </button>
          <button class="btn-ctrl accent" @click="controlAction('skip')" title="Skip">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M5 4l11 8-11 8V4z"/><rect x="18" y="4" width="3" height="16" rx="1"/></svg>
          </button>
        </div>

        <!-- Queue -->
        <div class="queue-header" x-show="queueList.length > 0">
          <span class="queue-label" x-text="'Up Next · ' + queueList.length">Up Next</span>
          <div class="queue-actions" x-show="queueList.length > 1">
            <button class="btn-shuffle" @click="controlAction('shuffle')">&#8644; Shuffle</button>
            <button class="btn-clear" @click="clearQueue()">Clear</button>
          </div>
        </div>

        <div
          id="queue-sortable"
          x-sort.ghost="reorderQueue($item, $position)"
          x-sort:handle=".drag-handle"
          x-sort:config="{ onStart: () => dragging = true, onEnd: () => dragging = false }"
          x-effect="renderQueue($el, queueList)"
        ></div>

        <template x-if="queueList.length === 0">
          <div class="empty-state">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
              <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
            <p>Queue is empty</p>
          </div>
        </template>

      </div>

      <!-- Search tab -->
      <div class="tab-panel" :class="{ active: activeTab === 'search' }">

        <!-- Provider pills -->
        <div class="provider-row">
          <button class="provider-pill" :class="{ active: searchProvider === 'youtube' }"
            @click="searchProvider = 'youtube'; performSearch()">
            YouTube
          </button>
          <button class="provider-pill" :class="{ active: searchProvider === 'jiosaavn' }"
            @click="searchProvider = 'jiosaavn'; performSearch()">
            JioSaavn
          </button>
          <button class="provider-pill" :class="{ active: searchProvider === 'radio' }"
            @click="searchProvider = 'radio'; performSearch()">
            Radio
          </button>
        </div>

        <!-- Search input -->
        <div class="search-row">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="search"
            :placeholder="searchProvider === 'radio' ? 'Search radio stations…' : 'Search songs, artists…'"
            x-model="searchQuery"
            @input.debounce.450ms="performSearch()"
            autocomplete="off" />
        </div>

        <!-- Loader -->
        <div class="center-loader" x-show="searching">
          <div class="loader"></div>
        </div>

        <!-- Results -->
        <template x-for="(res, i) in searchResults" :key="i">
          <div class="result-row" @click="queueSong(res)">
            <div class="result-thumb">
              <template x-if="res.image">
                <img :src="res.image" alt="" />
              </template>
              <template x-if="!res.image">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.4">
                  <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
                </svg>
              </template>
            </div>
            <div class="result-info">
              <div class="result-title" x-text="res.title"></div>
              <div class="result-artist" x-text="res.artist"></div>
            </div>
            <div class="result-right">
              <span class="result-dur" x-text="res.duration"></span>
              <div class="btn-add">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
              </div>
            </div>
          </div>
        </template>

        <template x-if="!searching && searchQuery && searchResults.length === 0">
          <div class="empty-state">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
            </svg>
            <p>No results for "<span x-text="searchQuery"></span>"</p>
          </div>
        </template>

        <template x-if="!searching && !searchQuery">
          <div class="empty-state">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <p>Type above to search</p>
          </div>
        </template>

      </div>
    </div>

    <!-- ── Bottom tab bar ── -->
    <nav class="tabbar">
      <button class="tab-btn" :class="{ active: activeTab === 'player' }" @click="switchTab('player')">
        <svg width="20" height="20" viewBox="0 0 24 24" :fill="activeTab === 'player' ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 4l14 8-14 8V4z"/>
        </svg>
        Player
      </button>
      <button class="tab-btn" :class="{ active: activeTab === 'search' }" @click="switchTab('search')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        Search
      </button>
    </nav>

    <!-- ── Toast ── -->
    <div class="toast" :class="{ show: showToast }">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      <span x-text="toastMessage"></span>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
